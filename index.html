  }
  .placeholder\:text-muted::placeholder {
    color: var(--muted);
  }
  @media (hover: hover) {
    .hover\:border-muted:hover {
      border-color: var(--muted);
    }
    .hover\:bg-mint:hover {
      background-color: var(--mint);
    }
    .hover\:bg-mint-deep:hover {
      background-color: var(--mint-deep);
    }
    .hover\:bg-neg-bg:hover {
      background-color: var(--neg-bg);
    }
    .hover\:bg-zero-bg:hover {
      background-color: var(--zero-bg);
    }
    .hover\:text-ink:hover {
      color: var(--ink);
    }
    .hover\:opacity-90:hover {
      opacity: 90%;
    }
  }
  .disabled\:cursor-default:disabled {
    cursor: default;
  }
  .disabled\:opacity-50:disabled {
    opacity: 50%;
  }
  @media (width >= 40rem) {
    .sm\:col-span-1 {
      grid-column: span 1 / span 1;
    }
    .sm\:w-auto {
      width: auto;
    }
    .sm\:max-w-lg {
      max-width: var(--container-lg);
    }
    .sm\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .sm\:grid-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .sm\:items-center {
      align-items: center;
    }
    .sm\:rounded-3xl {
      border-radius: var(--radius-3xl);
    }
    .sm\:text-2xl {
      font-size: var(--text-2xl);
      line-height: var(--tw-leading, var(--text-2xl--line-height));
    }
    .sm\:text-sm {
      font-size: var(--text-sm);
      line-height: var(--tw-leading, var(--text-sm--line-height));
    }
  }
  @media (width >= 48rem) {
    .md\:grid-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }
}
@layer base {
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 {
    text-wrap: balance;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  input:focus, select:focus {
    outline: 2px solid var(--focus);
    outline-offset: 0;
    border-color: transparent;
  }
  a {
    color: inherit;
    text-decoration: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
